name: Dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]

defaults:
  run:
    working-directory: dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: flood, POSTGRES_PASSWORD: flood, POSTGRES_DB: flood}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U flood" --health-interval 5s --health-retries 20
      kafka:
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
    env:
      DB_URL: postgresql+psycopg://flood:flood@localhost:5432/flood
      KAFKA: localhost:9092
      KAFKA_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: dashboard/requirements.txt}
      - run: pip install -r requirements.txt pytest httpx
      - name: Seed the database
        run: PGPASSWORD=flood psql -h localhost -U flood -d flood -v ON_ERROR_STOP=1 -q -f tests/seed.sql
      - name: Wait for Kafka
        run: |
          python - <<'EOF'
          import time
          from confluent_kafka.admin import AdminClient
          for _ in range(30):
              try:
                  AdminClient({"bootstrap.servers": "localhost:9092"}).list_topics(timeout=3); break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Kafka not ready")
          EOF
      - run: pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: dashboard/web/package-lock.json}
      - run: cd web && npm ci && npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flood-dashboard .
