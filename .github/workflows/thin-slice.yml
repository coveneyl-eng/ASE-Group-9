name: Thin slice

on:
  push:
    branches: [main]
    paths: ["thin-slice/**", "APIs/**", "static/**", ".github/workflows/thin-slice.yml"]
  pull_request:
    paths: ["thin-slice/**", "APIs/**", "static/**", ".github/workflows/thin-slice.yml"]

defaults:
  run:
    working-directory: thin-slice

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: thin-slice/requirements.txt}
      - run: pip install -r requirements.txt -r ../APIs/notification/requirements.txt pytest
      - run: OFFLINE=1 pytest tests -q --junitxml=reports/unit-junit.xml
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: thin-slice/portal/package-lock.json}
      - run: cd portal && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: unit-reports, path: thin-slice/reports/}

  thin-slice:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/gen_certs.sh
      - run: docker compose up -d --build
      - run: sleep 45 && docker compose ps
      - run: ./scripts/verify.sh
      - if: always()
        run: docker compose logs --no-color > reports/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: thin-slice-reports, path: thin-slice/reports/}

  publish-images:
    if: github.ref == 'refs/heads/main' && vars.ACR_NAME != ''
    needs: thin-slice
    runs-on: ubuntu-latest
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ vars.ACR_NAME }}
      - run: |
          docker build -f Dockerfile -t ${{ vars.ACR_NAME }}.azurecr.io/smartcity/agents:${{ github.sha }} ..
          docker build -t ${{ vars.ACR_NAME }}.azurecr.io/smartcity/portal-gateway:${{ github.sha }} portal
          docker push ${{ vars.ACR_NAME }}.azurecr.io/smartcity/agents:${{ github.sha }}
          docker push ${{ vars.ACR_NAME }}.azurecr.io/smartcity/portal-gateway:${{ github.sha }}
