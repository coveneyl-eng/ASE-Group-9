# Continuous delivery: after main changes, build the thin-slice and dashboard images and publish them to GitHub Container Registry.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: thin-slice
            context: .
            file: flood-thin-slice/Dockerfile
          - name: flood-agent
            context: flood-thin-slice/agent
            file: flood-thin-slice/agent/Dockerfile
          - name: flood-dashboard
            context: dashboard
            file: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-azure:
    name: Deploy to Azure (optional)
    needs: publish
    if: ${{ vars.AZURE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Points an existing Azure Container Apps job at the image just published.
      - run: |
          az containerapp job update \
            --name "${{ vars.AZURE_CONTAINERAPP_JOB }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository_owner }}/thin-slice:latest"
