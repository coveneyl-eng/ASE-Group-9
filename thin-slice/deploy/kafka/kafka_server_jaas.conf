// SASL/PLAIN users for the Kafka broker (dev only; production uses Key Vault-managed credentials).
// The apache/kafka image requires KAFKA_OPTS to point at this file whenever a SASL listener is enabled.
KafkaServer {
  org.apache.kafka.common.security.plain.PlainLoginModule required
  username="smartcity"
  password="smartcity-pass"
  user_smartcity="smartcity-pass";
};
