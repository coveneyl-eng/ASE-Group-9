# Scrapes the OpenTelemetry Prometheus exporter that every agent/service exposes on :9464.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: smartcity
    static_configs:
      - targets:
          - mqtt-bridge:9464
          - ingest:9464
          - flood-detector:9464
          - flood-scope:9464
          - flood-predictor:9464
          - rerouting:9464
          - event-monitoring:9464
          - event-coordinating:9464
          - public-transport:9464
          - traffic-monitoring:9464
          - traffic-control:9464
          - notification:9464
          - approval:9464
          - ws-hub:9464
